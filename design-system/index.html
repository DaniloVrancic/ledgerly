  --accent-forest: #9cd4ba;

:root {
  --space-0: 0px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 40px;
  --space-8: 48px;
  --space-9: 64px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 999px;
  --border-width-hairline: 1px;
  --border-width-control: 1.5px;
  --border-width-focus: 2px;
  --touch-min: 44px;
  --control-height: 48px;
  --nav-height: 64px;
  --nav-raise: 24px;
  --icon-sm: 16px;
  --icon-md: 20px;
  --icon-lg: 24px;
  --duration-fast: 100ms;
  --duration-base: 180ms;
  --duration-slow: 260ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-exit: cubic-bezier(0.4, 0, 1, 1);
  --font-sans: Inter, "Segoe UI", Roboto, system-ui, sans-serif;
}
.balance { font-family: var(--font-sans); font-size: 2.25rem; line-height: 2.75rem; font-weight: 700; letter-spacing: -0.02em; }
.amount-large { font-family: var(--font-sans); font-size: 1.5rem; line-height: 2rem; font-weight: 600; letter-spacing: -0.01em; }
.amount { font-family: var(--font-sans); font-size: 1rem; line-height: 1.5rem; font-weight: 600; letter-spacing: 0; }
.amount-small { font-family: var(--font-sans); font-size: 0.8125rem; line-height: 1.125rem; font-weight: 500; letter-spacing: 0; }
.title-large { font-family: var(--font-sans); font-size: 1.5rem; line-height: 2rem; font-weight: 600; letter-spacing: -0.01em; }
.title { font-family: var(--font-sans); font-size: 1.125rem; line-height: 1.5rem; font-weight: 600; letter-spacing: 0; }
.subtitle { font-family: var(--font-sans); font-size: 1rem; line-height: 1.5rem; font-weight: 500; letter-spacing: 0; }
.body { font-family: var(--font-sans); font-size: 1rem; line-height: 1.5rem; font-weight: 400; letter-spacing: 0; }
.body-small { font-family: var(--font-sans); font-size: 0.875rem; line-height: 1.25rem; font-weight: 400; letter-spacing: 0; }
.label { font-family: var(--font-sans); font-size: 0.875rem; line-height: 1.25rem; font-weight: 500; letter-spacing: 0; }
.caption { font-family: var(--font-sans); font-size: 0.75rem; line-height: 1rem; font-weight: 500; letter-spacing: 0.01em; }

/* Ledgerly components. Every value comes from tokens.css. Sizes that hold text use rem and
   min-height, so layouts grow with Android's text scale instead of clipping. */

[data-accent="lake"] { --accent: var(--accent-lake); --accent-text: var(--accent-lake); }
[data-accent="plum"] { --accent: var(--accent-plum); --accent-text: var(--accent-plum); }
[data-accent="slate"] { --accent: var(--accent-slate); --accent-text: var(--accent-slate); }

.lg-root, [data-theme] { color: var(--text-primary); font-family: var(--font-sans); font-size: 1rem; line-height: 1.5; }
.lg-root *, .lg-root *::before, .lg-root *::after { box-sizing: border-box; }
.lg-icon { flex: none; display: block; }
.lg-muted { color: var(--text-secondary); }
.lg-faint { color: var(--text-tertiary); }
.lg-stack { display: flex; flex-direction: column; gap: var(--space-3); }
.lg-inline { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.lg-between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-1) var(--space-3); }
.lg-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

:where(button, a, input, [tabindex]):focus-visible, .is-focused {
  outline: var(--border-width-focus) solid var(--accent); outline-offset: 2px;
}

/* ---- Money ---- */
.money { font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }
.money--positive { color: var(--positive); }
.money--negative { color: var(--negative); }
.money--neutral { color: var(--neutral); }
.money-pair { display: inline-flex; flex-direction: column; align-items: flex-end; text-align: right; }
.money-pair__sub { font-size: 0.8125rem; line-height: 1.125rem; font-weight: 500; color: var(--text-tertiary); }
[data-amounts="hidden"] .money { position: relative; color: transparent !important; user-select: none; display: inline-block; min-width: 4.5ch; }
[data-amounts="hidden"] .money::after {
  content: "•••••"; position: absolute; right: 0; top: 0; color: var(--text-tertiary); letter-spacing: 0.08em;
}
[data-amounts="hidden"] .lg-axis-value, [data-amounts="hidden"] .lg-cell__amount, [data-amounts="hidden"] .lg-chart__tip { visibility: hidden; }

/* ---- Button ---- */
.lg-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: var(--control-height); padding: var(--space-2) var(--space-4); border-radius: var(--radius-md);
  border: var(--border-width-hairline) solid transparent; background: transparent; color: var(--accent-text);
  font: 500 0.875rem/1.25rem var(--font-sans); cursor: pointer; text-align: center;
  transition: background var(--duration-fast) var(--ease-standard), transform var(--duration-fast) var(--ease-standard);
}
.lg-btn--primary { background: var(--accent); color: var(--on-accent); }
.lg-btn--secondary { border-color: var(--border-control); background: var(--surface-1); }
.lg-btn--danger { color: var(--negative); border-color: var(--negative); background: transparent; }
.lg-btn--small { min-height: var(--touch-min); padding: var(--space-1) var(--space-3); }
.lg-btn--block { width: 100%; }
.lg-btn:hover { background: var(--surface-tint); }
.lg-btn--primary:hover { background: var(--accent); opacity: .92; }
.lg-btn:active, .lg-btn.is-pressed { background: var(--surface-3); transform: scale(.985); }
.lg-btn--primary:active, .lg-btn--primary.is-pressed { background: var(--accent); opacity: .84; }
.lg-btn.is-selected { background: var(--surface-tint); border-color: var(--accent); }
.lg-btn--primary.is-selected { background: var(--accent); box-shadow: inset 0 0 0 2px var(--on-accent); }
.lg-btn:disabled, .lg-btn.is-disabled { background: var(--surface-2); border-color: transparent; color: var(--text-disabled); cursor: not-allowed; opacity: 1; transform: none; }
.lg-btn.is-loading { pointer-events: none; }
.lg-btn.is-error { color: var(--negative); border-color: var(--negative); background: var(--negative-tint); }
.lg-spinner { width: 1em; height: 1em; border: 2px solid currentColor; border-right-color: transparent; border-radius: var(--radius-full); animation: lg-spin 700ms linear infinite; }
@keyframes lg-spin { to { transform: rotate(360deg); } }

/* ---- Inputs ---- */
.lg-field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.lg-field__label { font: 500 0.875rem/1.25rem var(--font-sans); color: var(--text-secondary); }
.lg-field__hint { font: 500 0.75rem/1rem var(--font-sans); color: var(--text-tertiary); }
.lg-input {
  display: flex; align-items: center; gap: var(--space-2); min-height: var(--control-height); padding: 0 var(--space-3);
  border: var(--border-width-control) solid var(--border-control); border-radius: var(--radius-sm); background: var(--surface-1); color: var(--text-primary);
  transition: border-color var(--duration-fast) var(--ease-standard);
}
.lg-input input { all: unset; flex: 1; min-width: 0; font: 400 1rem/1.5rem var(--font-sans); color: var(--text-primary); }
.lg-input input::placeholder { color: var(--text-tertiary); opacity: 1; }
.lg-input:focus-within, .lg-input.is-focused { border-color: var(--accent); outline: var(--border-width-focus) solid var(--accent); outline-offset: 0; }
.lg-input.is-pressed { background: var(--surface-2); }
.lg-input.is-selected { background: var(--surface-tint); border-color: var(--accent); }
.lg-input.is-disabled { background: var(--surface-2); border-color: var(--border-subtle); color: var(--text-disabled); }
.lg-input.is-disabled input, .lg-input.is-disabled input::placeholder { color: var(--text-disabled); }
.lg-input.is-error { border-color: var(--negative); }
.lg-field.is-error .lg-field__hint { color: var(--negative); display: flex; gap: var(--space-1); align-items: center; }
.lg-search { border-radius: var(--radius-md); background: var(--surface-2); border-color: transparent; color: var(--text-tertiary); }
.lg-search.is-focused, .lg-search:focus-within { background: var(--surface-1); }
.lg-icon-btn { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; min-width: var(--touch-min); min-height: var(--touch-min); border-radius: var(--radius-sm); color: var(--text-secondary); cursor: pointer; }
.lg-icon-btn:hover { background: var(--surface-2); }
.lg-icon-btn:focus-visible { outline: var(--border-width-focus) solid var(--accent); outline-offset: 2px; }

/* ---- Switch and checkbox ---- */
.lg-switch { display: inline-flex; align-items: center; gap: var(--space-3); min-height: var(--touch-min); cursor: pointer; font: 400 0.875rem/1.25rem var(--font-sans); }
.lg-switch input, .lg-check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.lg-switch__track { position: relative; width: 44px; height: 26px; border-radius: var(--radius-full); background: var(--surface-2); border: var(--border-width-control) solid var(--border-control); flex: none; transition: background var(--duration-base) var(--ease-standard); }
.lg-switch__track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: var(--radius-full); background: var(--border-control); transition: transform var(--duration-base) var(--ease-standard); }
.lg-switch input:checked + .lg-switch__track, .lg-switch.is-selected .lg-switch__track { background: var(--accent); border-color: var(--accent); }
.lg-switch input:checked + .lg-switch__track::after, .lg-switch.is-selected .lg-switch__track::after { transform: translateX(18px); background: var(--on-accent); }
.lg-switch input:focus-visible + .lg-switch__track, .lg-switch.is-focused .lg-switch__track { outline: var(--border-width-focus) solid var(--accent); outline-offset: 2px; }
.lg-switch.is-focused, .lg-check.is-focused, .lg-seg.is-focused { outline: none; }
.lg-switch.is-pressed .lg-switch__track { background: var(--surface-3); }
.lg-switch.is-disabled, .lg-check.is-disabled { color: var(--text-disabled); cursor: not-allowed; }
.lg-switch.is-disabled .lg-switch__track { background: var(--surface-2); border-color: var(--border-subtle); }
.lg-switch.is-disabled .lg-switch__track::after { background: var(--text-disabled); }
.lg-switch.is-error .lg-switch__track, .lg-check.is-error .lg-check__box { border-color: var(--negative); }
.lg-switch.is-loading .lg-switch__track::after { animation: lg-pulse 900ms ease-in-out infinite; }
@keyframes lg-pulse { 50% { opacity: .35; } }
.lg-check { display: inline-flex; align-items: center; gap: var(--space-3); min-height: var(--touch-min); cursor: pointer; font: 400 0.875rem/1.25rem var(--font-sans); }
.lg-check__box { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; border: var(--border-width-control) solid var(--border-control); background: var(--surface-1); color: transparent; flex: none; }
.lg-check input:checked + .lg-check__box, .lg-check.is-selected .lg-check__box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.lg-check input:focus-visible + .lg-check__box, .lg-check.is-focused .lg-check__box { outline: var(--border-width-focus) solid var(--accent); outline-offset: 2px; }
.lg-check.is-pressed .lg-check__box { background: var(--surface-3); }
.lg-check.is-disabled .lg-check__box { background: var(--surface-2); border-color: var(--border-subtle); }

/* ---- Segmented control ---- */
.lg-seg { display: flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: var(--radius-md); background: var(--surface-2); min-width: 0; }
.lg-seg__item { all: unset; box-sizing: border-box; flex: 1 1 0; min-width: min-content; min-height: 38px; padding: var(--space-1) var(--space-2); display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); border-radius: 9px; font: 500 0.875rem/1.25rem var(--font-sans); color: var(--text-secondary); cursor: pointer; text-align: center; transition: background var(--duration-base) var(--ease-standard); }
.lg-seg__item:hover { color: var(--text-primary); }
.lg-seg__item:focus-visible, .lg-seg__item.is-focused { outline: var(--border-width-focus) solid var(--accent); outline-offset: 1px; }
.lg-seg__item.is-pressed { background: var(--surface-3); }
.lg-seg__item[aria-pressed="true"], .lg-seg__item.is-selected { background: var(--surface-1); color: var(--accent-text); box-shadow: inset 0 0 0 1px var(--border-subtle); }
.lg-seg__item.is-disabled { color: var(--text-disabled); cursor: not-allowed; }
.lg-seg__item.is-error { color: var(--negative); }
.lg-seg__item[data-kind="expense"][aria-pressed="true"] { color: var(--negative); }
.lg-seg__item[data-kind="income"][aria-pressed="true"] { color: var(--positive); }
.lg-seg__item[data-kind="transfer"][aria-pressed="true"] { color: var(--neutral); }
.lg-seg--small .lg-seg__item { min-height: 36px; }

/* ---- Cards, rows, headers ---- */
.lg-card { background: var(--surface-1); border: var(--border-width-hairline) solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-4); min-width: 0; }
.lg-card--flush { padding: 0; overflow: hidden; }
.lg-card--action { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.lg-card--action:hover, .lg-card.is-pressed { background: var(--surface-2); }
.lg-card.is-selected { border-color: var(--accent); background: var(--surface-tint); }
.lg-card.is-disabled { background: var(--surface-2); color: var(--text-disabled); }
.lg-card.is-error { border-color: var(--negative); }
.lg-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); min-height: 56px; padding: var(--space-2) var(--space-4); width: 100%; background: transparent; border: 0; border-top: var(--border-width-hairline) solid var(--border-subtle); color: inherit; font: inherit; text-align: left; cursor: pointer; }
.lg-row:first-child { border-top: 0; }
.lg-row:hover { background: var(--surface-2); }
.lg-row:active, .lg-row.is-pressed { background: var(--surface-3); }
.lg-row.is-selected { background: var(--surface-tint); }
.lg-row.is-disabled { color: var(--text-disabled); cursor: not-allowed; background: transparent; }
.lg-row.is-disabled * { color: inherit !important; }
.lg-row.is-error .lg-row__sub { color: var(--negative); }
.lg-row__lead { flex: none; width: 40px; height: 40px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--text-secondary); }
.lg-row__body { flex: 1 1 8rem; min-width: 0; }
.lg-row__title { font: 500 1rem/1.5rem var(--font-sans); overflow-wrap: anywhere; }
.lg-row__sub { font: 400 0.875rem/1.25rem var(--font-sans); color: var(--text-secondary); overflow-wrap: anywhere; display: flex; flex-wrap: wrap; align-items: center; gap: 2px var(--space-2); }

.lg-side__item { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: var(--space-3); min-height: var(--touch-min); padding: 0 var(--space-3); border-radius: var(--radius-sm); font: 500 0.875rem/1.25rem var(--font-sans); color: var(--text-secondary); cursor: pointer; }

/* ---- Keypad and Add ---- */

.lg-tx { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-4); min-height: 64px; width: 100%; background: transparent; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; border-top: var(--border-width-hairline) solid var(--border-subtle); }

/* ---- Attention, badges, status ---- */

.lg-readonly { display: inline-flex; align-items: flex-start; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); background: var(--surface-2); font: 500 0.75rem/1rem var(--font-sans); color: var(--text-secondary); }

/* ---- Calendar ---- */

.lg-cell__top { display: flex; justify-content: center; align-items: center; gap: 4px; }

.lg-cell__amount { font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; }
.lg-cell__amount .is-full, .lg-cell__cat, .lg-cell__count { display: none; }
.lg-cell__foot { display: flex; align-items: center; justify-content: center; min-height: 12px; }

.lg-cell.is-pressed { filter: brightness(.96); }
.lg-cell.is-selected, .lg-cell[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }

.lg-cell.is-outside { --cell-bg: var(--background) !important; --cell-fg: var(--text-tertiary) !important; }
.lg-cell.is-planned { box-shadow: none; outline: 1px dashed var(--border-control); outline-offset: -1px; }
.lg-cell.is-disabled { --cell-bg: var(--background); --cell-fg: var(--text-disabled); cursor: default; box-shadow: none; }

@container (min-width: 560px) {
  .lg-cal__head { font-size: 0.875rem; }
  .lg-cell { min-height: 96px; padding: var(--space-2); text-align: left; font-size: 0.75rem; }

  };
  function balanceAt(date) {
    return D.accounts().reduce((s, a) => s + D.toEur(balanceBefore(a, date), a.cur), 0);
  }
  function balanceBefore(a, date) {
    let sum = a.balance;
    D.transactions.forEach((t) => {
      if (t.date <= date) return;
      if (t.account === a.id) sum -= t.type === 'income' || t.type === 'refund' ? t.amount : -t.amount;
      if (t.to === a.id) sum -= a.cur === t.cur ? t.amount : t.cur === 'EUR' ? Math.round(t.amount * D.PEG) : D.toEur(t.amount, t.cur);

    const max = niceMax(Math.max(...vals));
    const y = (val) => top + (1 - val / max) * (h - top - bottom);
    const band = (W - left) / 7;
    const peak = vals.indexOf(Math.max(...vals));
    const bars = vals.map((val, i) => {
      const x = left + band * i + band * 0.2;

    const net = income - spend;
    const cats = {};
    list.forEach((t) => { if (t.cat && D.counted(t) > 0) cats[t.cat] = (cats[t.cat] || 0) + D.counted(t); });

      const dt = new Date(start.getTime() + i * 864e5);

      const day = dt.getUTCDate();
      const outside = !date.startsWith(D.CURRENT);
      if (date > D.TODAY) {
        const planned = D.RECURRING.filter((r) => r.date === date && r.state === 'planned');

      }

  };

  // Year ledger: one line per month, like the lines of a ledger. Spending rises above the line,

// Behaviour for specimens and proof screens. All of it is demonstration. Nothing is saved.
(function (L) {
  const D = L.data;
  L.mount = function (root) {
    root.addEventListener('click', function (e) {
      const t = e.target;
      const seg = t.closest('[data-seg] .lg-seg__item');
      if (seg && !seg.classList.contains('is-disabled')) {
        seg.parentNode.querySelectorAll('.lg-seg__item').forEach((b) => b.setAttribute('aria-pressed', b === seg));
        const range = seg.closest('[data-range-toggle]');
        if (range) {
          const isYear = seg.textContent === 'Year';
          seg.closest('.lg-phone').querySelectorAll('[data-range]').forEach((p) => { p.hidden = (p.dataset.range === 'year') !== isYear; });
        }
        const add = seg.closest('[data-add]');
        if (add && seg.dataset.kind) { add.dataset.kind = seg.dataset.kind; refreshChips(add); }
        const ed = seg.closest('[data-cat-editor]');
        if (ed && seg.dataset.kind) ed.dataset.kind = seg.dataset.kind;
        const cats = seg.closest('[data-cat-kind]');
        if (cats) { const phone = seg.closest('[data-cats]'); phone.dataset.kind = seg.dataset.kind; refreshCategories(phone); }
      }
      const pill = t.closest('[data-add-account]');
      if (pill) {
        const add = pill.closest('[data-add]');
        const order = D.ACCOUNTS.map((a) => a.id);
        add.dataset.account = order[(order.indexOf(add.dataset.account) + 1) % order.length];
        pill.querySelector('span').textContent = D.acc(add.dataset.account).name;
        paintAmount(add);
        refreshChips(add);
      }
      const filter = t.closest('[data-cat-filter]');
      if (filter) {
        const phone = filter.closest('[data-cats]');
        phone.querySelectorAll('[data-cat-filter]').forEach((b) => b.setAttribute('aria-pressed', b === filter));
        phone.dataset.account = filter.dataset.catFilter;
        refreshCategories(phone);
      }
      if (t.closest('[data-cat-new]')) t.closest('[data-cats]').querySelector('[data-cat-overlay]').hidden = false;
      if (t.closest('[data-cat-close]')) t.closest('[data-cat-overlay]').hidden = true;
      const pickIcon = t.closest('[data-pick-icon]');
      if (pickIcon) {
        const ed = pickIcon.closest('[data-cat-editor]');
        pickIcon.parentNode.querySelectorAll('[data-pick-icon]').forEach((b) => b.setAttribute('aria-pressed', b === pickIcon));
        if (ed) { ed.dataset.icon = pickIcon.dataset.pickIcon; ed.image = null; ed.querySelector('[data-cat-upload-label]').textContent = 'Use my own image'; paintPreview(ed); }
      }
      const pickColour = t.closest('[data-pick-colour]');
      if (pickColour) {
        const ed = pickColour.closest('[data-cat-editor]');
        pickColour.parentNode.querySelectorAll('[data-pick-colour]').forEach((b) => b.setAttribute('aria-pressed', b === pickColour));
        if (ed) { ed.dataset.slot = pickColour.dataset.pickColour; paintPreview(ed); }
      }
      const pickAccount = t.closest('[data-pick-account]');
      if (pickAccount) {
        pickAccount.setAttribute('aria-pressed', pickAccount.getAttribute('aria-pressed') !== 'true');
        const ed = pickAccount.closest('[data-cat-editor]');
        if (ed) paintPreview(ed);
      }
      const save = t.closest('[data-cat-save]');
      if (save) saveCategory(save.closest('[data-cat-editor]'));
      const bal = t.closest('[data-balance]');
      if (bal) {
        const open = bal.parentNode.classList.toggle('is-open');
        bal.setAttribute('aria-expanded', open);
      }
      const hide = t.closest('[data-hide]');
      if (hide) {
        const el = document.documentElement;
        el.dataset.amounts = el.dataset.amounts === 'hidden' ? '' : 'hidden';
      }
      const key = t.closest('[data-key]');
      if (key) press(key);
      const chip = t.closest('[data-add] [data-chip]');
      if (chip && !chip.disabled) saved(chip);
      const undo = t.closest('[data-undo]');
      if (undo) {
        if (undo.dataset.undoCat) {
          D.removeCategory(undo.dataset.undoCat);
          const phone = undo.closest('[data-cats]');
          if (phone) refreshCategories(phone);
        }
        undo.closest('.lg-toast').remove();
      }
      const attn = t.closest('[data-attn]');
      if (attn) {
        const row = attn.closest('.lg-attn');
        row.innerHTML = `<span class="lg-attn__icon" style="color:var(--positive)">${L.icon('check', 20)}</span><span class="lg-row__body"><span class="lg-row__sub">Done</span></span>`;
      }
      const cell = t.closest('[data-day]');
      if (cell) {
        const phone = cell.closest('.lg-phone') || root;
        phone.querySelectorAll('[data-day]').forEach((c) => c.setAttribute('aria-pressed', c === cell));
        const panel = phone.querySelector('[data-day-panel]');
        if (panel) panel.innerHTML = L.screens.dayPanel(cell.dataset.day);
        const figure = cell.closest('.lg-chart');
        const note = figure && figure.querySelector('[data-chart-tip]');
        if (note) note.textContent = cell.dataset.tip;
      }
      const line = t.closest('.lg-year__row[data-tip]');
      if (line) {
        const fig = line.closest('.lg-year');
        fig.querySelectorAll('[data-tip]').forEach((b) => b.setAttribute('aria-pressed', b === line));
        fig.querySelector('[data-chart-tip]').textContent = line.dataset.tip;
      }
      const mark = t.closest('.lg-chart .is-hit');
      if (mark) {
        const fig = mark.closest('.lg-chart');
        fig.querySelectorAll('[data-selected]').forEach((m) => m.removeAttribute('data-selected'));
        mark.setAttribute('data-selected', 'true');
        const tip = fig.querySelector('[data-chart-tip]');
        if (tip) tip.textContent = mark.dataset.tip;
      }
    });
    root.addEventListener('input', function (e) {
      const ed = e.target.closest('[data-cat-name]');
      if (ed) {
        ed.classList.remove('is-error');
        ed.querySelector('.lg-input').classList.remove('is-error');
        ed.querySelector('[data-cat-hint]').textContent = 'Shown on chips and in reports.';
        paintPreview(e.target.closest('[data-cat-editor]'));
      }
    });
    root.addEventListener('change', function (e) {
      const all = e.target.closest('[data-pick-all]');
      if (all) {
        const box = all.closest('[data-pick-accounts]');
        box.querySelectorAll('[data-pick-account]').forEach((b) => {
          b.disabled = all.checked;
          if (all.checked) b.setAttribute('aria-pressed', 'false');
        });
        paintPreview(all.closest('[data-cat-editor]'));
      }
      const image = e.target.closest('[data-pick-image]');
      if (image && image.files[0]) {
        const ed = image.closest('[data-cat-editor]');
        const reader = new FileReader();
        reader.onload = () => {
          ed.image = reader.result;
          ed.querySelectorAll('[data-pick-icon]').forEach((b) => b.setAttribute('aria-pressed', false));
          ed.querySelector('[data-cat-upload-label]').textContent = image.files[0].name;
          paintPreview(ed);
        };
        reader.readAsDataURL(image.files[0]);
      }
    });
    root.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('is-hit')) {
        e.preventDefault();
        e.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
      }
    });
  };
  const curOf = (add) => D.acc(add.dataset.account).cur;
  const amountOf = (add) => Math.round(parseFloat(add.dataset.value || '0') * 100);
  function paintAmount(add) {
    const minor = amountOf(add);
    const out = add.querySelector('[data-amount]');
    out.innerHTML = L.money(minor, curOf(add));
    out.classList.toggle('is-empty', !minor);
  }
  // Chips follow the type and the account, because categories belong to accounts.
  function refreshChips(add) {
    const box = add.querySelector('[data-chips]');
    const minor = amountOf(add);
    if (add.dataset.kind === 'transfer') {
      box.innerHTML = L.ui.button('Save transfer', { kind: 'primary', block: true, state: minor ? undefined : 'disabled', attr: 'data-chip="Transfer"' });
      return;
    }
    box.innerHTML = L.ui.addChips(add.dataset.account, add.dataset.kind, !minor);
  }
  function press(key) {
    const add = key.closest('[data-add]');
    if (!add) return;
    const k = key.dataset.key;
    let v = add.dataset.value || '';
    if (k === 'del') v = v.slice(0, -1);
    else if (k === '.') { if (!v.includes('.')) v += v ? '.' : '0.'; }
    else if (!/\.\d\d$/.test(v) && v.length < 9) v += k;
    add.dataset.value = v;
    paintAmount(add);
    refreshChips(add);
  }
  function saved(chip) {
    const add = chip.closest('[data-add]');
    const minor = amountOf(add);
    const name = chip.dataset.chip;
    const where = name === 'Later' ? 'to Needs Review' : name === 'Transfer' ? 'as a transfer' : `in ${name}`;
    add.querySelector('[data-toast-slot]').innerHTML = L.ui.toast(`Saved ${L.money(minor, curOf(add))} ${where}`, { more: 'Add another' });
    add.dataset.value = '';
    paintAmount(add);
    refreshChips(add);
  }
  function refreshCategories(phone) {
    phone.querySelector('[data-cat-list]').innerHTML = L.ui.categoryList(phone.dataset.kind, phone.dataset.account || undefined);
  }
  function chosenAccounts(ed) {
    return [...ed.querySelectorAll('[data-pick-account][aria-pressed="true"]')].map((b) => b.dataset.pickAccount);
  }
  function paintPreview(ed) {
    const name = ed.querySelector('[data-cat-name] input').value.trim() || 'New category';
    const allOn = ed.querySelector('[data-pick-all]').checked;
    const accounts = chosenAccounts(ed).map((id) => D.acc(id).name).join(', ');
    const sub = allOn ? 'All accounts' : accounts || 'Choose at least one account';
    const tile = L.ui.catTile({ name, icon: ed.dataset.icon, slot: Number(ed.dataset.slot), img: ed.image }, 24);
    const box = ed.querySelector('[data-cat-preview]');
    box.innerHTML = `${tile}<span class="lg-row__body"><span class="lg-row__title"></span><span class="lg-row__sub">${sub}</span></span>`;
    box.querySelector('.lg-row__title').textContent = name;
  }
  function saveCategory(ed) {
    const field = ed.querySelector('[data-cat-name]');
    const input = field.querySelector('input');
    const name = input.value.trim();
    if (!name) {
      field.classList.add('is-error');
      field.querySelector('.lg-input').classList.add('is-error');
      field.querySelector('[data-cat-hint]').textContent = 'Give it a name first.';
      input.focus();
      return;
    }
    const allOn = ed.querySelector('[data-pick-all]').checked;
    const accounts = allOn ? [] : chosenAccounts(ed);
    if (!allOn && !accounts.length) { paintPreview(ed); return; }
    const id = `custom-${Date.now()}`;
    D.addCategory({ id, name, slot: Number(ed.dataset.slot), icon: ed.dataset.icon, img: ed.image, kind: ed.dataset.kind }, accounts);
    const phone = ed.closest('[data-cats]');
    if (phone) {
      refreshCategories(phone);
      ed.closest('[data-cat-overlay]').hidden = true;
    }
    const slot = (phone || ed.parentNode).querySelector('[data-toast-slot]');
    slot.innerHTML = L.ui.toast(`Added ${name.replace(/</g, '&lt;')}`);
    slot.querySelector('[data-undo]').dataset.undoCat = id;
    input.value = '';
    paintPreview(ed);
  }
})(window.Ledgerly = window.Ledgerly || {});

  add('Charts', 'ChartCalendarHeat', 720, 'A month of daily net amounts, signed and in euros, with month totals. Wide layouts add the top category and the entry count.', { provides: 'Daily totals.', do: 'Show plus or minus and the currency in every cell.', dont: 'Leave blank gaps at the start of a month.' }, () => L.charts.calendarFull(D.TODAY));
  add('Charts', 'ChartYearLedger', 720, 'Twelve months as twelve ledger lines. Spending rises above the line and income hangs below it.', { provides: 'Daily totals.', do: 'Keep days in columns, so rent and payday line up down the year.', dont: 'Use a grid of squares by week.' }, () => L.charts.year());
  add('Charts', 'ChartPalette', 170, 'Six rank slots, a neutral Other and the sequential heat scale.', { provides: 'Slots, by rank.', do: 'Reuse slot 1 for the largest item.', dont: 'Use semantic colours as slots.' }, () => `<div class="ds-swatches">${[1, 2, 3, 4, 5, 6].map((i) => `<div class="ds-swatch"><i style="background:var(--chart-${i})"></i><span>chart-${i}</span></div>`).join('')}<div class="ds-swatch"><i style="background:var(--chart-other)"></i><span>chart-other</span></div></div><div style="margin-top:12px">${L.heatKey()}</div>`);
  add('Charts', 'ChartEmpty', 180, 'What a chart shows before there is data.', { provides: 'The question.', do: 'Keep the question as the title.', dont: 'Draw fake data.' }, () => L.charts.empty('Where did my money go?'));

  add('Brand', 'AppIcon', 200, 'An open isometric ledger with a rising chart, a green euro and a coral dollar. Temporary, because Ledgerly is a working name.', { provides: 'A size.', do: 'Use the fixed colours in both themes.', dont: 'Recolour the coins. They carry the income and expense meaning.' }, () => `<div class="lg-stack"><div class="ds-iconrow">${L.appIcon(128)}${L.appIcon(72)}${L.appIcon(48)}${L.appIcon(32)}${L.appIcon(24)}</div><div class="lg-inline"><span class="lg-badge lg-badge--proto">Temporary</span>${L.appIcon(32)}<span class="lg-wordmark">Ledgerly</span></div></div>`);
  add('Brand', 'PrintStyle', 460, 'PDF reports: light only and readable in black and white.', { provides: 'Report data.', do: 'Use patterns and words instead of colour.', dont: 'Print the dark theme.' }, () => {

  });

  add('Proof', 'ScreenHistory', 1040, 'Prototype. Transaction history on phone.', { provides: 'Nothing. A composition.', do: 'Check the daily totals against Calendar.', dont: 'Treat this as implemented.' }, () => L.proof('Transaction history on phone', L.screens.history));

  L.catalog = cat;
  L.renderCard = function (name, el) {
    const c = cat.find((x) => x.name === name);

<script>window.LEDGERLY_DOCS = {"README":"Ledgerly is a quiet everyday tool, opened 10 to 20 times a day to record money or check a balance. Build every screen from these tokens and components. If something is missing, add it here first.\n\nEach token has a usage note. A consuming screen loads `tokens.css`, then `ledgerly.css`, and sets `data-theme` on its root.\n\n## Content fundamentals\n\nWrite plainly, calmly and precisely, with no guilt and no hype. Say what happened, then what can be done. Use sentence case and \"you\" only where a sentence needs it. Never use exclamation marks or emoji. Full wording examples are in the Writing section.\n\n- Use the defined terms exactly: Balance, Income, Spending, Net, Savings rate, Earmarked for goals, Free to use.\n- Offline is normal, so never mention sync, online or loading from a server. Say \"Backed up 2 days ago\".\n\n## Visual foundations\n\n**Colour.** Use semantic tokens, never raw values. `positive` is income, `negative` is expense, `warning` is attention, and `neutral` is transfers and supporting information. These meanings never change. `accent` is for interactive elements only and the user chooses it. Always pair colour with a sign, an icon or a label.\n\n**Type.** Set everything in Inter. Set money with tabular numerals through `.money`. `balance` is the largest element on any screen. Body text is `body` or `body-small`, and nothing is smaller than `caption`, which is 12px. Sizes are in rem so they follow Android's text setting: let rows grow, let long names wrap, and never truncate an amount.\n\n**Money.** Write €1,234.56 and 1,234.56 KM. A negative amount uses a real minus, as in −€20.00. The original amount sits first and the converted amount sits below it in `amount-small`. Very large values step down one or two sizes on cards and stay complete. Only chart labels and calendar cells use a compact form.\n\n**Spacing and shape.** Spacing is an 8-point scale with a 4px half step. `space-4` is the phone gutter and card padding. Radii run from `radius-sm` at 8px to `radius-lg` at 16px. `radius-full` is only for circles and pills.\n\n**Depth.** In light, use `elevation-1` for the Add button and toasts, and `elevation-2` for sheets and dialogs. In dark, shadows are off: step up the surface tokens and use `border-subtle`.\n\n**Focus.** The focus ring is a solid 2px `accent` line, offset 2px, and holds 3:1 on every surface in all four accent options.\n\n**Touch.** Touch targets are at least `touch-min`, 44px. Primary controls stay in the lower half of the phone.\n\n**Motion.** Motion is short: `duration-fast` for press, `duration-base` for toggles, `duration-slow` for sheets, with `ease-standard`. With reduced motion turned on, everything happens at once. Nothing bounces or celebrates.\n\n## Iconography\n\nUse the one line set in `Ledgerly.icon(name, size)`: a 24px grid, a 1.75 stroke, round caps, no fills, drawn for this system. Sizes are 16, 20 and 24. A standalone icon needs a label. Do not use emoji or a second icon set.\n\nThe brand motif is the isometric ledger. It appears in colour only as the app icon, and as line art in empty, error and first-run states through `Ledgerly.stateMark(icon)`. The bundled files are in `brand/`.\n\n## Using the files\n\n- `tokens.css` and `tokens.json` hold the same tokens, generated from one source.\n- `ledgerly.css` holds every component style.\n- `brand/` holds the app icon as SVG, in full and small sizes.\n- `ledgerly.js` exposes `Ledgerly.ui`, which returns HTML for every component, plus `Ledgerly.charts` and `Ledgerly.money`.\n- Inter is not included: the app bundles it, and this system falls back to the system sans until then.\n","data-visualisation":"# Data visualisation\n\nOne chart style covers every view. Charts sit on `surface-1` inside a `Card`, and the title is the question the chart answers.\n\n## Rules\n\n- **Axes.** Bars start at zero. There is only one axis per chart. The baseline is `chart-axis`.\n- **Gridlines.** Three at most, in `chart-grid`, so they recede.\n- **Labels.** Label directly where there is room: line ends, weekday bars, the donut total. Use a key only for grouped bars.\n- **Tooltips.** Selecting a mark shows its figures in a plain panel below the chart, so the text is never covered by a finger.\n- **Selection.** Every bar, slice and point is a focusable button. A selected mark gets a `text-primary` outline, and the app then opens the transactions behind it.\n- **Empty.** Keep the question as the title, then one sentence. Never draw fake data.\n- **Screen readers.** Every chart has a text description that states the key figures. Keep it current with the data.\n- **Avoid.** No 3D, truncated bar axes, dual axes, gradients, week-by-week square grids, or donuts with more than six slices.\n\n## Colour\n\nCharts use six rank slots plus a neutral Other, `chart-1` to `chart-6` and `chart-other`. Slot 1 is always the largest item. **Colour in a chart means rank, not category,** because any six of twelve category colours cannot be kept distinct for colour-blind users. The ranked list beside a donut shows each category's own icon and name, so identity carries over.\n\nIncome and spending bars are the exception: they use `positive-fill` and `negative-fill`, because those are semantic.\n\nColour is never the only cue. Lines also use dash patterns and direct labels, donut slices have gaps, and the list repeats each value.\n\n## Heat scale\n\n`heat-0` to `heat-5` is one sequential scale in both themes. It shades spending, so it stays in the coral family. `on-heat-low` is the text on steps 0 to 4, and `on-heat-high` is the text on step 5. Steps are fixed by daily EUR amount, so a shade means the same thing every month: under €20, under €50, under €100, under €300, and €300 or more.\n\n## Calendar month\n\nEvery cell shows its date and a signed amount in euros, such as −€17 or +€2.0k. A day that ends with a net gain uses `positive-tint` instead of a heat step. Days from the months around it fill the grid, so it never starts with blank cells, and planned items appear on their future dates with a dashed outline. Month totals sit above the grid. At 560px and wider, each cell shows the full amount, the top category and the entry count.\n\nA shade is never the only cue: every cell has a number, and markers show recurring items, income, days of €300 or more, and planned items.\n\n## Year ledger\n\nThe year is twelve ledger lines, one per month, with days in columns from 1 to 31. Spending rises above the line and income hangs below it. Height follows the same five spending steps as the heat scale, and the tallest step also uses the darker `negative`. Because days share columns, rent on the 1st and salary on the 28th line up down the year, so a break in the rhythm stands out. Each line shows its month total, and selecting a line shows that month's figures and its busiest day.\n\nDo not draw the year as a grid of squares by week. It says little about money and copies how code contribution charts look.\n\n## Palette separation\n\nPalette distance is measured in OKLab, multiplied by 100, as the smallest gap between any two colours in the set. Values of about 2 or under are hard to tell apart. The measured values are in the Contrast section.\n","categories":"# Custom categories\n\nPeople can add their own categories, with any icon they want. Each category belongs to accounts.\n\n## What a category holds\n\n- **Name.** Up to 32 characters, including č, ć, đ, š and ž.\n- **Type.** Expense or Income.\n- **Icon.** Anything in the line set, or the person's own image. An image is cropped to a square, resized to about 96px and stored with the attachments. It always sits beside the name, because an image brings no guarantee of contrast.\n- **Colour.** One of the twelve curated colours. Colour stays curated so that chips stay readable.\n- **Accounts.** All accounts by default, or the accounts chosen. At least one is needed.\n\n## How accounts change the app\n\n- The Add sheet shows only the categories that belong to the selected account. Changing the account pill changes the chips, and the All chip follows the same rule.\n- History, budgets and reports always keep a category, whichever account it belongs to. Changing its accounts later never moves or hides past entries.\n- A category with no account limit appears for every account.\n- An account with few categories still shows Later, so an entry can always be saved.\n\n## Where it lives\n\nThe Categories screen sits under More. It lists categories by type and can filter by account. A new category opens as a sheet, so it can also be created from the All chip on the Add sheet without leaving the flow.\n\n## Rules\n\n- Offer the whole icon set. Do not limit icons to the built-in categories.\n- Show a live preview of the tile, name and accounts at the top of the form.\n- Mark a person's own categories with the label Yours.\n- Categories in use cannot be destroyed. Deleting one still needs its entries moved, or it can be archived.\n","writing":"# Writing\n\nPlain, calm and precise. No guilt, no hype. Ledgerly states what is true and what can be done next.\n\n## Voice\n\n- **Plain.** Use everyday words. Say \"Spending\", not \"Expenditure\".\n- **Calm.** Going over a budget is a fact, not a failure.\n- **Precise.** Give the number and the date.\n- **Short.** One sentence where one will do. No exclamation marks.\n\n## Example wording\n\n| Moment | Write | Avoid |\n|---|---|---|\n| Empty state | Nothing here yet. Transactions you add will appear here, grouped by day. | You haven't added anything! Start your journey today |\n| Budget warning | Food is at 89%, with €42.94 left for 2 days. | Careful! You're about to blow your budget |\n| Over limit | Shopping is €24.89 over its limit. | You overspent again |\n| Backup failure | Backup failed. Ledgerly could not write to your backup folder. Your data is safe on this phone. | Error 500: backup failure |\n| Estimate label | Estimate. Based on your balance, upcoming bills and normal daily spending. | Guaranteed safe to spend |\n| Undo | Transaction deleted. Undo | Are you sure? |\n| Import failure | This file could not be read. It may be damaged. Nothing in Ledgerly was changed. | Import failed |\n\n## Empty-state style\n\nEvery empty state has the same parts: the line ledger with one icon rising out of it, a short heading, one sentence, and at most one action. No full-colour illustrations or mascots. A cleared Needs Review list is a calm statement of fact: \"All reviewed.\"\n\n## Definitions\n\nShow these words wherever the metric appears, in a tooltip.\n\n| Term | Definition |\n|---|---|\n| Balance | Sum of all account balances. Credit cards count as negative. |\n| Income | Income transactions only. |\n| Spending | Expenses minus refunds. |\n| Net | Income minus spending. |\n| Savings rate | Net divided by income. |\n","also":"# Brand, print and privacy\n\n## App icon and wordmark\n\n**Temporary, because Ledgerly is a working name.** The mark is an open isometric ledger on deep forest. A three-column chart rises out of its pages, with a green euro coin for income and a coral dollar coin for expense. Below 36px the page rules drop out and the coins grow. The colours are the `brand-*` tokens, which are the same in both themes, because an app icon does not change with the theme. The wordmark is Inter semibold with slightly tight spacing.\n\nThe same ledger, as line art, is the empty-state style. The line icon set includes it as `ledger`, along with `dollar` and `euro`.\n\n## Print\n\nPDF reports use the `PrintStyle` specimen: white paper, black text, light only, whatever theme the app is in. A report must read in black and white, so bars use a hatched pattern, every value is a number, signs stay on money, and table rules separate rows. Keep cards from breaking across pages.\n\n## Hidden amounts\n\nSetting `data-amounts=\"hidden\"` on the root replaces every `.money` value with five dots. The dot count is always the same, so the length of a number is not revealed. Layout does not move. Chart axis values hide too, while the shapes remain, because proportions alone give no amounts.\n\nThis CSS mask is for the visual style only. In the app, the Money component must not render the real value at all while hidden, and it should expose the label \"Hidden amount\" to screen readers.\n\n## Accent colours\n\nThe user picks Forest, Lake, Plum or Slate. The accent changes only `accent` and `accent-text`: primary buttons, focus, selected controls and links. None of the options is a red, an amber or a bright green, so an accent cannot be mistaken for a semantic colour. Use `data-accent` on the root.\n\n## Large text\n\nSizes are in rem. The specimens have a Large text control at 130% and 200%. Rows grow, labels wrap, and amounts stay on one line and stay complete. Calendar cells are the one fixed exception: their amount stays sized to the cell, and the day panel always shows the full figure.\n","contrast":"# Contrast\n\nMeasured by the build with the WCAG 2 formula, and the build fails if any pair falls below its floor. Text needs 4.5:1. Large text and interface marks need 3:1. Text on `text-disabled` is excluded, because WCAG exempts inactive controls.\n\n## What changed from the base colours\n\n| Base colour | Now | Why |\n|---|---|---|\n| #D9685D coral | negative #B23F35 | Coral as text measures only about 3.2:1 on the off-white. The darker tone reaches 4.5:1 on every surface. The base stays as negative-fill for bars and marks, where 3:1 applies. |\n| #D9A441 amber | warning #7A5710 | Amber as text measures about 2.1:1. The dark tone is for text and icons. |\n| #D9A441 amber | warning-mark #9C6F12 | The base also fails the 3:1 floor for marks, so budget bars and markers use this tone. The base stays as warning-fill, always with charcoal text on it. |\n| no positive colour given | positive #1F6B4F | The primary #163D32 is nearly as dark as the text, so it cannot read as a signal. Income needed its own visibly green tone at 4.5:1. |\n| nothing changed | #163D32, #E8F2EC, #F7F8F5, #252C2A | All four base colours pass as given and are used unchanged. |\n\n## Measured pairs\n\n| Foreground | Background | Use | Floor | Light | Dark |\n|---|---|---|---|---|---|\n| `text-primary` | `background` | Text | 4.5:1 | 13.38:1 | 16.34:1 |\n| `text-primary` | `surface-1` | Text | 4.5:1 | 14.26:1 | 15.07:1 |\n| `text-primary` | `surface-2` | Text | 4.5:1 | 12.65:1 | 13.82:1 |\n| `text-primary` | `surface-3` | Text | 4.5:1 | 11.63:1 | 12.20:1 |\n| `text-primary` | `surface-tint` | Text | 4.5:1 | 12.46:1 | 12.69:1 |\n| `text-secondary` | `background` | Text | 4.5:1 | 6.73:1 | 9.94:1 |\n| `text-secondary` | `surface-1` | Text | 4.5:1 | 7.18:1 | 9.17:1 |\n| `text-secondary` | `surface-2` | Text | 4.5:1 | 6.37:1 | 8.41:1 |\n| `text-secondary` | `surface-3` | Text | 4.5:1 | 5.85:1 | 7.42:1 |\n| `text-secondary` | `surface-tint` | Text | 4.5:1 | 6.27:1 | 7.72:1 |\n| `text-tertiary` | `background` | Text | 4.5:1 | 5.27:1 | 7.21:1 |\n| `text-tertiary` | `surface-1` | Text | 4.5:1 | 5.62:1 | 6.65:1 |\n| `text-tertiary` | `surface-2` | Text | 4.5:1 | 4.99:1 | 6.10:1 |\n| `text-tertiary` | `surface-3` | Text | 4.5:1 | 4.58:1 | 5.38:1 |\n| `text-tertiary` | `surface-tint` | Text | 4.5:1 | 4.91:1 | 5.60:1 |\n| `accent-forest` | `background` | Text | 4.5:1 | 11.27:1 | 11.14:1 |\n| `accent-forest` | `surface-1` | Text | 4.5:1 | 12.02:1 | 10.28:1 |\n| `accent-forest` | `surface-2` | Text | 4.5:1 | 10.66:1 | 9.42:1 |\n| `accent-forest` | `surface-3` | Text | 4.5:1 | 9.80:1 | 8.32:1 |\n| `accent-forest` | `surface-tint` | Text | 4.5:1 | 10.50:1 | 8.65:1 |\n| `accent-lake` | `background` | Text | 4.5:1 | 8.13:1 | 10.37:1 |\n| `accent-lake` | `surface-1` | Text | 4.5:1 | 8.66:1 | 9.57:1 |\n| `accent-lake` | `surface-2` | Text | 4.5:1 | 7.68:1 | 8.78:1 |\n| `accent-lake` | `surface-3` | Text | 4.5:1 | 7.07:1 | 7.74:1 |\n| `accent-lake` | `surface-tint` | Text | 4.5:1 | 7.57:1 urface-3` | Mark | 3:1 | 7.07:1 | 7.74:1 |\n| `accent-plum` | `surface-3` | Mark | 3:1 | 7.53:1 | 7.48:1 |\n| `accent-slate` | `surface-3` | Mark | 3:1 | 7.47:1 | 8.14:1 |\n| `cat-1` | `surface-1` | Mark | 3:1 | 7.91:1 | 5.30:1 |\n| `cat-2` | `surface-1` | Mark | 3:1 | 5.11:1 | 10.55:1 |\n| `cat-3` | `surface-1` | Mark | 3:1 | 4.39:1 | 7.71:1 |\n| `cat-4` | `surface-1` | Mark | 3:1 | 5.56:1 | 8.00:1 |\n| `cat-5` | `surface-1` | Mark | 3:1 | 6.42:1 | 9.03:1 |\n| `cat-6` | `surface-1` | Mark | 3:1 | 4.40:1 | 4.18:1 |\n| `cat-7` | `surface-1` | Mark | 3:1 | 5.64:1 | 8.84:1 |\n| `cat-8` | `surface-1` | Mark | 3:1 | 5.53:1 | 11.50:1 |\n| `cat-9` | `surface-1` | Mark | 3:1 | 4.16:1 | 4.54:1 |\n| `cat-10` | `surface-1` | Mark | 3:1 | 6.39:1 | 11.20:1 |\n| `cat-11` | `surface-1` | Mark | 3:1 | 8.65:1 | 4.23:1 |\n| `cat-12` | `surface-1` | Mark | 3:1 | 10.16:1 | 6.29:1 |\n| `chart-1` | `surface-1` | Mark | 3:1 | 4.96:1 | 6.19:1 |\n| `chart-2` | `surface-1` | Mark | 3:1 | 5.64:1 | 6.07:1 |\n| `chart-3` | `surface-1` | Mark | 3:1 | 10.57:1 | 10.79:1 |\n| `chart-4` | `surface-1` | Mark | 3:1 | 5.35:1 | 9.99:1 |\n| `chart-5` | `surface-1` | Mark | 3:1 | 5.47:1 | 4.39:1 |\n| `chart-6` | `surface-1` | Mark | 3:1 | 9.83:1 | 9.48:1 |\n| `chart-other` | `surface-1` | Mark | 3:1 | 3.72:1 | 4.96:1 |\n| `brand-income` | `brand-tile` | Mark | 3:1 | 6.35:1 | 6.35:1 |\n| `brand-expense` | `brand-tile` | Mark | 3:1 | 4.52:1 | 4.52:1 |\n| `brand-page` | `brand-tile` | Mark | 3:1 | 11.27:1 | 11.27:1 |\n| `on-heat-low` | `heat-0` | Text | 4.5:1 | 14.26:1 | 15.07:1 |\n| `on-heat-low` | `heat-1` | Text | 4.5:1 | 12.31:1 | 13.64:1 |\n| `on-heat-low` | `heat-2` | Text | 4.5:1 | 10.55:1 | 11.10:1 |\n| `on-heat-low` | `heat-3` | Text | 4.5:1 | 8.42:1 | 8.04:1 |\n| `on-heat-low` | `heat-4` | Text | 4.5:1 | 5.83:1 | 5.15:1 |\n| `on-heat-high` | `heat-5` | Text | 4.5:1 | 5.87:1 | 7.09:1 |\n\n## Colour-blind separation\n\nSmallest OKLab distance between any two colours in the set, times 100, simulated with Machado et al. 2009 at full severity.\n\n| Palette | Theme | Normal | Protanopia | Deuteranopia | Tritanopia |\n|---|---|---|---|---|---|\n| Chart slots and Other | light | 13.1 | 5.9 | 4.8 | 4.7 |\n| Category colours | light | 6.8 | 3.7 | 4.0 | 4.8 |\n| Chart slots and Other | dark | 12.8 | 7.1 | 6.6 | 9.3 |\n| Category colours | dark | 6.4 | 4.0 | 4.6 | 3.9 |\n\nThe nearest category colour to any semantic fill is 9.0 in light and 8.1 in dark. Twelve colours cannot all stay far apart, so a category always appears with its icon and name.\n","usage":"# Usage rules\n\nShort do and don't examples for every component.\n\n| Component | Do | Don't |\n|---|---|---|\n| ColourTokens | Use `negative` for an expense amount as text. | Use `negative-fill` for text. It only reaches 3:1. |\n| TypeScale | Set money in `balance`, `amount-large`, `amount` or `amount-small`. | Set text below 12px, or body text below 14px. |\n| Money | Show the original amount first and the conversion smaller below it. | Use a hyphen as a minus, or colour without a sign. |\n| HiddenAmounts | Mask with the same dots whatever the length, so the mask reveals nothing. | Leave chart axes or the real value in the accessibility tree. The app must render the label \"Hidden amount\" instead. |\n| IconSet | Give an icon a label when it stands alone. | Mix filled icons or another set. |\n| Button | Use one primary button per view. | Use coral for a normal action. Danger is only for delete and reset. |\n| TextInput | Keep the label above the field. | Use the placeholder as the label. |\n| SearchField | Let 12.50 find amounts. | Add a Search or Apply button. |\n| Switch | Apply the change immediately. | Pair it with a Save button. |\n| SegmentedControl | Keep labels to one word. | Use it for actions. |\n| Checkbox | Use it in multi-select and report sections. | Use it for one instant setting. That is a switch. |\n| Card | Keep padding at `space-4`. | Nest cards. |\n| ListRow | Let long Bosnian names wrap. | Truncate amounts. |\n| SectionHeader | Keep it to two or three words. | Add more than one action. |\n| Tooltip | Define every metric the same way everywhere. | Put actions in a tooltip. |\n| BottomSheet | Keep actions at the bottom, in thumb reach. | Stack two sheets. |\n| Dialog | Name the action on the button. | Use a dialog when Undo would work. |\n| Toast | Say what happened, then offer Undo. | Celebrate. No exclamation marks. |\n| BottomNav | Keep Add in the centre on every screen. | Show more than five items. |\n| NavRail | Keep labels available to screen readers. | Stretch the phone bar across a tablet. |\n| Sidebar | Keep the file date visible at all times. | Add an Add button. Desktop is read-only. |\n| ReadOnlyLabel | Show the date and time of the file. | Hide it to save space. |\n| StatePatterns | Use the line ledger with one icon rising out of it. | Use full-colour illustrations, mascots or guilt. |\n| Keypad | Keep keys 56px tall or taller and the pad at phone width, 360px at most. | Stretch the pad across a wide layout. Keys turn into thin bars. |\n| CategoryChip | Let chips take the width their label needs and flow onto the next row. | Force chips into equal columns. Long names clip. |\n| AddTransaction | Save on the chip tap. Show Undo and Add another afterwards. | Add a Save button to the normal flow. |\n| TransactionRow | Pair every colour with a sign. | Show more than the small icons in a row. |\n| TransferRow | Name both accounts. | Colour it green or coral. |\n| DayGroupHeader | Always show the sign. | Count transfers in the daily net. |\n| BalanceCard | Keep Total balance, Earmarked for goals and Free to use separate. | Add anything larger on the same screen. |\n| MetricTile | Keep the definition one tap away. | Invent a new metric name. |\n| BudgetBar | State the percentage in words beside the bar. | Rely on the bar colour alone. |\n| GoalProgress | Call it earmarked. | Subtract it from the total balance. |\n| NeedsAttentionRow | Show at most three on Home, hidden when empty. | Link away when the action can run in the row. |\n| RecurringBadge | Keep icon and word together. | Post silently. |\n| CalendarDayCell | Show the sign and the currency in every cell. | Use the shade alone. |\n| BackupStatus | Say that the data is safe when it is. | Imply a server or an online state. |\n| QuickAddWidget | Open straight to the keypad. | Put any amount on the home screen. |\n| CategoryIdentity | Pick colours from the set. Income categories share colours with expense categories because they never appear in one chart. | Offer a free colour picker. |\n| CategoryRow | Name the accounts on the row. | Hide which accounts a category uses. |\n| IconPicker | Offer the whole set and an image upload. | Limit people to one icon per category family. |\n| CategoryColourPicker | Mark the selected colour with a tick and a ring. | Rely on the colour alone to show selection. |\n| AccountPicker | Default to All accounts. | Allow saving with no account chosen. |\n| CategoryEditor | Show a live preview at the top. | Make people leave the Add sheet to create one. |\n| ChartGroupedBars | Start the axis at zero. | Use a second axis for net. |\n| ChartDonut | Colour by rank, and name the category with its icon. | Add a seventh slice. Group the rest as Other. |\n| ChartTrendLines | Label the line ends. | Rely on a legend. |\n| ChartWeekdayBars | Label each bar. | Sort the days. |\n| ChartBalanceLine | Start at zero unless values cross it. | Fill under the line with a gradient. |\n| ChartCalendarHeat | Show plus or minus and the currency in every cell. | Leave blank gaps at the start of a month. |\n| ChartYearLedger | Keep days in columns, so rent and payday line up down the year. | Use a grid of squares by week. |\n| ChartPalette | Reuse slot 1 for the largest item. | Use semantic colours as slots. |\n| ChartEmpty | Keep the question as the title. | Draw fake data. |\n| AppIcon | Use the fixed colours in both themes. | Recolour the coins. They c  #9949a3;\n  --chart-6: #683705;\n  --chart-other: #7c8782;\n  --chart-grid: #e2e5df;\n  --chart-axis: #7f8984;\n  --heat-0: #ffffff;\n  --heat-1: #fbebe6;\n  --heat-2: #f6d7cf;\n  --heat-3: #efbbaf;\n  --heat-4: #e2917f;\n  --heat-5: #a9443a;\n  --on-heat-low: #252c2a;\n  --on-heat-high: #ffffff;\n  --elevation-0: none;\n  --elevation-1: 0 1px 2px #14201c14;\n  --elevation-2: 0 8px 24px #14201c1f;\n}\n[data-theme=\"dark\"] {\n  --background: #0d1412;\n  --surface-1: #141d1a;\n  --surface-2: #1a2521;\n  --surface-3: #222f2a;\n  --surface-overlay: #222f2a;\n  --surface-inverse: #1a2521;\n  --on-inverse: #edf1ec;\n  --border-inverse: #26332e;\n  --surface-tint: #1b2d26;\n  --text-primary: #edf1ec;\n  --text-secondary: #b4c0ba;\n  --text-tertiary: #97a49d;\n  --text-disabled: #6b7871;\n  --border-subtle: #26332e;\n  --border-control: #6f7e76;\n  --primary: #9cd4ba;\n  --on-primary: #0d1412;\n  --primary-tint: #1f352d;\n  --positive: #7ccba2;\n  --positive-fill: #5faf87;\n  --positive-tint: #16302a;\n  --negative: #f0a195;\n  --negative-fill: #d9806f;\n  --negative-tint: #35201d;\n  --warning: #e6c27a;\n  --warning-fill: #d0a650;\n  --warning-mark: #d0a650;\n  --on-warning: #0d1412;\n  --warning-tint: #322a16;\n  --neutral: #aab6b0;\n  --neutral-fill: #7f8d86;\n  --neutral-tint: #222c28;\n  --accent: var(--accent-forest);\n  --on-accent: #0d1412;\n  --accent-text: var(--accent-forest);\n  --accent-forest: #9cd4ba;\n  --accent-lake: #9cc6ea;\n  --accent-plum: #cfb4e2;\n  --accent-slate: #bac8d2;\n  --scrim: #000000a6;\n  --brand-tile: #163d32;\n  --brand-page: #f7f8f5;\n  --brand-page-shade: #dce9e1;\n  --brand-edge: #b5d0c2;\n  --brand-edge-dark: #8db3a0;\n  --brand-cover: #2f8a66;\n  --brand-cover-dark: #22694e;\n  --brand-bar: #ffffff;\n  --brand-bar-left: #c9e2d5;\n  --brand-bar-right: #9cc9b3;\n  --brand-income: #5fd19e;\n  --brand-income-side: #2f8a66;\n  --brand-expense: #ee7f70;\n  --brand-expense-side: #a9443a;\n  --cat-1: #8689cc;\n  --cat-2: #add78c;\n  --cat-3: #63b5f1;\n  --cat-4: #dc9fc0;\n  --cat-5: #97c7a4;\n  --cat-6: #926fae;\n  --cat-7: #b7b6e1;\n  --cat-8: #c9d1fe;\n  --cat-9: #818847;\n  --cat-10: #fbc2ca;\n  --cat-11: #a86c88;\n  --cat-12: #a695c0;\n  --chart-1: #6c9de2;\n  --chart-2: #c88e46;\n  --chart-3: #e4c1ef;\n  --chart-4: #9dd2a5;\n  --chart-5: #a76bae;\n  --chart-6: #fbb075;\n  --chart-other: #7f8d86;\n  --chart-grid: #26332e;\n  --chart-axis: #6f7e76;\n  --heat-0: #141d1a;\n  --heat-1: #2a2220;\n  --heat-2: #472c27;\n  --heat-3: #6c3a32;\n  --heat-4: #9a4f43;\n  --heat-5: #d98a7b;\n  --on-heat-low: #edf1ec;\n  --on-heat-high: #14100f;\n  --elevation-0: none;\n  --elevation-1: none;\n  --elevation-2: none;\n}\n:root {\n  --space-0: 0px;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 40px;\n  --space-8: 48px;\n  --space-9: 64px;\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 16px;\n  --radius-full: 999px;\n  --border-width-hairline: 1px;\n  --border-width-control: 1.5px;\n  --border-width-focus: 2px;\n  --touch-min: 44px;\n  --control-height: 48px;\n  --nav-height: 64px;\n  --nav-raise: 24px;\n  --icon-sm: 16px;\n  --icon-md: 20px;\n  --icon-lg: 24px;\n  --duration-fast: 100ms;\n  --duration-base: 180ms;\n  --duration-slow: 260ms;\n  --ease-standard: cubic-bezier(0.2, 0, 0, 1);\n  --ease-exit: cubic-bezier(0.4, 0, 1, 1);\n  --font-sans: Inter, \"Segoe UI\", Roboto, system-ui, sans-serif;\n}\n.balance { font-family: var(--font-sans); font-size: 2.25rem; line-height: 2.75rem; font-weight: 700; letter-spacing: -0.02em; }\n.amount-large { font-family: var(--font-sans); font-size: 1.5rem; line-height: 2rem; font-weight: 600; letter-spacing: -0.01em; }\n.amount { font-family: var(--font-sans); font-size: 1rem; line-height: 1.5rem; font-weight: 600; letter-spacing: 0; }\n.amount-small { font-family: var(--font-sans); font-size: 0.8125rem; line-height: 1.125rem; font-weight: 500; letter-spacing: 0; }\n.title-large { font-family: var(--font-sans); font-size: 1.5rem; line-height: 2rem; font-weight: 600; letter-spacing: -0.01em; }\n.title { font-family: var(--font-sans); font-size: 1.125rem; line-height: 1.5rem; font-weight: 600; letter-spacing: 0; }\n.subtitle { font-family: var(--font-sans); font-size: 1rem; line-height: 1.5rem; font-weight: 500; letter-spacing: 0; }\n.body { font-family: var(--font-sans); font-size: 1rem; line-height: 1.5rem; font-weight: 400; letter-spacing: 0; }\n.body-small { font-family: var(--font-sans); font-size: 0.875rem; line-height: 1.25rem; font-weight: 400; letter-spacing: 0; }\n.label { font-family: var(--font-sans); font-size: 0.875rem; line-height: 1.25rem; font-weight: 500; letter-spacing: 0; }\n.caption { font-family: var(--font-sans); font-size: 0.75rem; line-height: 1rem; font-weight: 500; letter-spacing: 0.01em; }\n";</script>
<script>// The single-file design system page.
(function () {
  const L = window.Ledgerly;
  const docs = window.LEDGERLY_DOCS;
  const html = document.documentElement;
  const nav = document.getElementById('nav');
  const bar = document.getElementById('bar');
  const content = document.getElementById('content');
  const store = {
    get(k) { try { return localStorage.getItem(`lg-${k}`); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(`lg-${k}`, v); } catch (e) { /* preference only */ } },
  };
  let mode = store.get('mode') || 'light';

  function inline(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  }
  function md(text) {
    const lines = text.trim().split('\n');
    let out = '';
    let list = false;
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (/^\|/.test(l)) {
        const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        const head = cells(l).map((c) => `<th>${inline(c)}</th>`).join('');
        i += 2;
        let body = '';
        for (; i < lines.length && /^\|/.test(lines[i]); i++) body += `<tr>${cells(lines[i]).map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`;
        i--;
        out += `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
        continue;
      }
      if (/^- /.test(l)) { if (!list) { out += '<ul>'; list = true; } out += `<li>${inline(l.slice(2))}</li>`; continue; }
      if (list) { out += '</ul>'; list = false; }
      if (/^## /.test(l)) out += `<h2>${inline(l.slice(3))}</h2>`;
      else if (/^# /.test(l)) out += '';
      else if (l.trim()) out += `<p>${inline(l)}</p>`;
    }
    return out + (list ? '</ul>' : '');
  }

  const groups = [...new Set(L.catalog.map((c) => c.group))];
  const prose = [['overview', 'Overview', 'README'], ['contrast', 'Colour and contrast', 'contrast'], ['dataviz', 'Data visualisation', 'data-visualisation'], ['categories', 'Custom categories', 'categories'], ['writing', 'Writing', 'writing'], ['brand', 'Brand, print, privacy', 'also'], ['usage', 'Usage rules', 'usage']];

  nav.innerHTML = `<div class="lg-inline" style="padding:0 12px 12px">${L.appIcon(28)}<span class="lg-wordmark">Ledgerly</span></div>`
    + prose.map(([id, name]) => `<a href="#${id}">${name}</a>`).join('')
    + groups.map((g) => `<div class="site-nav__group">${g}</div><a href="#group-${g}">All ${g.toLowerCase()}</a>`).join('')
    + '<div class="site-nav__group">Files</div><a href="#tokens">Tokens</a>';

  function barHtml() {
    const seg = (items, cur, key) => `<div class="lg-seg lg-seg--small" data-ctl="${key}">${items.map(([v, n]) => `<button type="button" class="lg-seg__item" aria-pressed="${v === cur}" data-v="${v}">${n}</button>`).join('')}</div>`;
    return `<label>Theme ${seg([['light', 'Light'], ['dark', 'Dark'], ['both', 'Both']], mode, 'mode')}</label>
      <label>Accent <select data-ctl="accent">${L.tokens.accents.map((a) => `<option value="${a.id}"${html.dataset.accent === a.id ? ' selected' : ''}>${a.name}</option>`).join('')}</select></label>
      <label>Text size <select data-ctl="scale"><option value="100">100%</option><option value="130">130%</option><option value="200">200%</option></select></label>
      ${L.ui.switch('Hide amounts').replace('lg-switch "', 'lg-switch" data-ctl="hide"')}`;
  }

  function pane(c, theme) {
    const wide = c.group === 'Proof' || c.height > 900;
    return `<div class="site-comp__pane lg-root" ${theme ? `data-theme="${theme}"` : ''} data-render="${c.name}"${wide ? ' data-wide' : ''}></div>`;
  }
  function renderPanes() {
    document.querySelectorAll('[data-spec]').forEach((box) => {
      const c = L.catalog.find((x) => x.name === box.dataset.spec);
      const both = mode === 'both' && c.group !== 'Proof';
      box.innerHTML = both ? pane(c, 'light') + pane(c, 'dark') : pane(c);
    });
    document.querySelectorAll('[data-render]').forEach((el) => {
      const c = L.catalog.find((x) => x.name === el.dataset.render);
      el.innerHTML = c.render();
    });
  }
  function page() {
    const sec = (id, title, body) => `<section class="site-section" id="${id}">${title ? `<h2>${title}</h2>` : ''}${body}</section>`;
    const textual = prose.map(([id, name, key]) => sec(id, name, `<div class="prose ${id === 'contrast' || id === 'usage' ? 'prose--wide' : ''}">${md(docs[key])}</div>`)).join('');
    const comps = groups.map((g) => sec(`group-${g}`, g, L.catalog.filter((c) => c.group === g).map((c) => `<article class="site-comp" id="c-${c.name}"><h3>${c.name}</h3><p class="site-comp__sum">${c.summary}</p><div class="site-comp__spec" data-spec="${c.name}"></div><div class="site-do"><div><b>Do</b><span>${inline(c.guide.do)}</span></div><div><b>Don't</b><span>${inline(c.guide.dont)}</span></div></div></article>`).join(''))).join('');
    const tokens = sec('tokens', 'Tokens', `<div class="prose prose--wide"><p>These are the same tokens in two formats, generated from one source by <code>build.mjs</code>.</p></div><h3 class="title">tokens.css</h3><div class="site-code" tabindex="0"></div><h3 class="title">tokens.json</h3><div class="site-code" tabindex="0"></div>`);
    content.innerHTML = textual + comps + tokens;
    const codes = content.querySelectorAll('.site-code');
    codes[0].textContent = window.LEDGERLY_TOKENS_CSS;
    codes[1].textContent = window.LEDGERLY_TOKENS_JSON;
  }

  function applyMode() {
    html.dataset.theme = mode === 'dark' ? 'dark' : 'light';
    store.set('mode', mode);
    renderPanes();
  }
  bar.innerHTML = barHtml();
  bar.addEventListener('click', (e) => {
    const b = e.target.closest('[data-ctl="mode"] [data-v]');
    if (!b) return;
    mode = b.dataset.v;
    bar.querySelectorAll('[data-ctl="mode"] [data-v]').forEach((x) => x.setAttribute('aria-pressed', x === b));
    applyMode();
  });
  bar.addEventListener('change', (e) => {
    const ctl = e.target.dataset.ctl;
    if (ctl === 'accent') { html.dataset.accent = e.target.value === 'forest' ? '' : e.target.value; store.set('accent', e.target.value); }
    if (ctl === 'scale') html.style.fontSize = `${e.target.value}%`;
    if (e.target.getAttribute('role') === 'switch') html.dataset.amounts = e.target.checked ? 'hidden' : '';
  });
  const savedAccent = store.get('accent');
  if (savedAccent && savedAccent !== 'forest') { html.dataset.accent = savedAccent; bar.querySelector('[data-ctl="accent"]').value = savedAccent; }
  page();
  applyMode();
  L.mount(content);
})();
</script>
