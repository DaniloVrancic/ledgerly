<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledgerly Design System</title>
<style>
/*TOKENS*/
/*CSS*/
html { background: var(--background); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--background); color: var(--text-primary); font-family: var(--font-sans); }
.site { display: flex; min-height: 100vh; }
.site-nav { position: sticky; top: 0; align-self: flex-start; width: 232px; flex: none; height: 100vh; overflow-y: auto; padding: 16px 12px; border-right: 1px solid var(--border-subtle); box-sizing: border-box; }
.site-nav a { display: flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 8px; color: var(--text-secondary); text-decoration: none; font: 500 0.875rem/1.25rem var(--font-sans); }
.site-nav a:hover { background: var(--surface-2); color: var(--text-primary); }
.site-nav__group { margin: 12px 12px 4px; font: 500 0.75rem/1rem var(--font-sans); color: var(--text-tertiary); }
.site-main { flex: 1; min-width: 0; overflow-x: clip; }
.site-bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 24px; background: var(--background); border-bottom: 1px solid var(--border-subtle); }
.site-bar label { font: 500 0.75rem/1rem var(--font-sans); color: var(--text-secondary); display: inline-flex; align-items: center; gap: 8px; }
.site-bar .lg-seg { min-width: 0; }
.site-bar > * { max-width: 100%; flex-wrap: wrap; }
.site-bar select { min-height: 40px; padding: 0 8px; border-radius: 8px; border: 1.5px solid var(--border-control); background: var(--surface-1); color: var(--text-primary); font: 500 0.875rem/1.25rem var(--font-sans); }
.site-content { max-width: 1120px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 40px; }
.site-section > h2 { font: 600 1.5rem/2rem var(--font-sans); margin: 0 0 16px; }
.site-comp { padding: 16px 0; border-top: 1px solid var(--border-subtle); scroll-margin-top: 72px; }
.site-comp h3 { font: 600 1.125rem/1.5rem var(--font-sans); margin: 0; }
.site-comp__sum { font: 400 0.875rem/1.25rem var(--font-sans); color: var(--text-secondary); margin: 4px 0 12px; max-width: 68ch; }
.site-comp__spec { display: flex; flex-wrap: wrap; gap: 12px; }
.site-comp__pane { flex: 1 1 320px; min-width: 0; padding: 12px; border-radius: 12px; border: 1px solid var(--border-subtle); background: var(--background); color: var(--text-primary); }
.site-comp__pane[data-wide] { flex-basis: 100%; }
.site-do { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 8px; margin-top: 12px; font: 400 0.875rem/1.25rem var(--font-sans); }
.site-do > div { display: flex; gap: 8px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); }
.prose { max-width: 72ch; font: 400 1rem/1.5rem var(--font-sans); }
.prose h1 { font: 600 1.5rem/2rem var(--font-sans); margin: 0 0 12px; }
.prose h2 { font: 600 1.125rem/1.5rem var(--font-sans); margin: 24px 0 8px; }
.prose table { display: block; overflow-x: auto; border-collapse: collapse; font: 400 0.875rem/1.25rem var(--font-sans); max-width: 100%; font-variant-numeric: tabular-nums; }
.prose th, .prose td { text-align: left; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
.prose code { font-size: .875em; background: var(--surface-2); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
.prose--wide { max-width: none; }
.site-code { max-height: 360px; overflow: auto; padding: 12px; border-radius: 8px; background: var(--surface-2); font: 400 0.75rem/1rem ui-monospace, Consolas, monospace; white-space: pre; }
@media (max-width: 860px) {
  .site-nav { display: none; }
  .site-bar { padding: 8px 16px; position: static; }
  .site-content { padding: 16px; }
}
</style>
</head>
<body class="lg-root">
<div class="site">
  <nav class="site-nav ds-chrome" id="nav" aria-label="Sections"></nav>
  <div class="site-main">
    <div class="site-bar ds-chrome" id="bar"></div>
    <main class="site-content" id="content"></main>
  </div>
</div>
<script>/*BUNDLE*/</script>
<script>/*DOCS*/</script>
<script>/*SITE*/</script>
</body>
</html>
