<style>
  html, body { margin: 0; background: var(--background); }
  .c { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--background); font-family: var(--font-sans); }
  .t { position: absolute; left: 32px; bottom: 32px; width: 440px; }
  .n { font-weight: 600; font-size: 88px; line-height: .95; letter-spacing: -0.02em; color: var(--text-primary); }
  .s { margin-top: 12px; font-size: 14px; line-height: 20px; color: var(--text-secondary); }
  .ground { fill: var(--brand-tile); }
  .cover { fill: var(--brand-cover); } .coverd { fill: var(--brand-cover-dark); }
  .page { fill: var(--brand-page); } .pageb { fill: var(--brand-page-shade); }
  .edge { fill: var(--brand-edge); } .edged { fill: var(--brand-edge-dark); }
  .chart { fill: none; stroke: var(--brand-chart); stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; }
  .side { fill: none; stroke: var(--brand-chart-side); stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; }
  .halo { fill: none; stroke: var(--brand-tile); stroke-width: 42; stroke-linecap: round; stroke-linejoin: round; }
  .dot { fill: var(--brand-tile); }
</style>
<div class="c">
  <!-- Blocks: brand-tile slab 480x288, ledger rhombus 400x200 in brand-cover and brand-page, line chart 24 wide in brand-chart.
       Arrangement: one slab bleeding off the top, right and bottom, with the ledger lying on it and the line chart rising out of it.
       Pattern: the literal motif, because the mark is an isometric ledger: rhombi on one 2:1 axis and one rising line.
       Scales: steps of space-5 and space-9, no corners, since isometric faces are cut square. -->
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true" style="position:absolute;inset:0">
    <rect class="ground" x="480" y="0" width="480" height="288"/>
    <polygon class="coverd" points="520,206 720,306 720,322 520,222"/>
    <polygon class="cover" points="720,306 920,206 920,222 720,322"/>
    <polygon class="cover" points="520,206 720,106 920,206 720,306"/>
    <polygon class="edged" points="536,192 720,284 720,308 536,216"/>
    <polygon class="edge" points="720,284 904,192 904,216 720,308"/>
    <polygon class="page" points="536,192 628,146 812,238 720,284"/>
    <polygon class="pageb" points="628,146 720,100 904,192 812,238"/>

    <polyline class="halo" points="828,30 884,30 884,86" transform="translate(6 6)"/>
    <polyline class="side" points="580,186 664,110 736,160 884,30" transform="translate(12 12)"/>
    <polyline class="side" points="828,30 884,30 884,86" transform="translate(12 12)"/>
    <polyline class="side" points="580,186 664,110 736,160 884,30" transform="translate(9 9)"/>
    <polyline class="side" points="828,30 884,30 884,86" transform="translate(9 9)"/>
    <polyline class="side" points="580,186 664,110 736,160 884,30" transform="translate(6 6)"/>
    <polyline class="side" points="828,30 884,30 884,86" transform="translate(6 6)"/>
    <polyline class="side" points="580,186 664,110 736,160 884,30" transform="translate(3 3)"/>
    <polyline class="side" points="828,30 884,30 884,86" transform="translate(3 3)"/>
    <polyline class="chart" points="580,186 664,110 736,160 884,30"/>
    <polyline class="chart" points="828,30 884,30 884,86"/>
    <circle class="dot" cx="580" cy="186" r="7"/>
    <circle class="dot" cx="664" cy="110" r="7"/>
    <circle class="dot" cx="736" cy="160" r="7"/>
  </svg>
  <div class="t"><div class="n">Ledgerly</div><div class="s">A calm way to record money and understand it at a glance.</div></div>
</div>
