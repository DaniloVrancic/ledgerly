name: ledgerly
description: "Offline personal finance for one person."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter
  # Local SQLite database with typed queries, migrations and live streams.
  drift: ^2.35.3
  # State: screens watch providers fed by the database's live queries.
  flutter_riverpod: ^3.4.3
  # Where the database and backups live on each platform.
  path_provider: ^2.1.6
  path: ^1.9.1
  # Time-ordered ids, so records from different devices never collide when sync is added.
  uuid: ^4.6.0
  # Number formatting.
  intl: ^0.20.3
  # Bar and line charts on the Insights screen.
  fl_chart: ^1.3.0
  # A person can use their own picture as a category icon. Uses the system photo picker.
  image_picker: ^1.2.4
  # The design system's line icons are SVG paths.
  flutter_svg: ^2.2.4
  # The system's own file picker, for bank statements, data files and the backup folder.
  file_picker: ^13.3.2
  # The .ledgerly data file is a ZIP.
  archive: ^4.6.0
  # Checks a data file's database read-only before it replaces anything. Drift already uses it.
  sqlite3: ^3.8.0
  # SHA-256 of every file in a data file, to prove it arrived whole.
  crypto: ^3.0.8
  # Scrypt, ChaCha20-Poly1305, HKDF and HMAC for password-protected data files (age format),
  # and PBKDF2 for the app lock PIN. Pure Dart.
  pointycastle: ^4.0.0
  # The fingerprint or face unlock for the app lock, through the system prompt.
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generates the database code from lib/data/database/tables.dart.
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    # The app icon, shown on the first screen. A copy of design-system/brand/app-icon.svg,
    # refreshed by tool/render_icons.dart.
    - assets/brand/app-icon.svg
