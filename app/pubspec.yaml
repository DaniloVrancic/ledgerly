name: ledgerly
description: "Offline personal finance for one person."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter
  # Local SQLite database with typed queries, migrations and live streams.
  drift: ^2.35.3
  # State: screens watch providers fed by the database's live queries.
  flutter_riverpod: ^3.4.3
  # Where the database and backups live on each platform.
  path_provider: ^2.1.6
  path: ^1.9.1
  # Time-ordered ids, so records from different devices never collide when sync is added.
  uuid: ^4.6.0
  # Number formatting.
  intl: ^0.20.3
  # Bar and line charts on the Insights screen.
  fl_chart: ^1.3.0
  # A person can use their own picture as a category icon. Uses the system photo picker.
  image_picker: ^1.2.4
  # The design system's line icons are SVG paths.
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generates the database code from lib/data/database/tables.dart.
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
